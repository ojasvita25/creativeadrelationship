dataset:
  name: "PeterBrendan/AdImageNet"
  split: "train"

pipeline:
  name: "Baseline (ResNet-18 + Lexical Jaccard)"
  type: "baseline"
  sample_size: null
  use_cache: false
  cache_dir: "cache"
  output_path: "reports/resnet18_rulebased.html"
  max_pairs_per_type: 10

models:
  visual_model: "resnet18"
  text_model: "jaccard"
  device: "auto"

thresholds:
  resnet_threshold: 0.73
  identical_phash_max: 2
  identical_text_min: 0.70
  identical_resnet_min: 0.93
  containment_resnet_min: 0.80
  containment_text_min: 0.70
  color_palette_max: 0.60
  text_variant_text_min: 0.10
  text_variant_text_max: 0.69
  layout_variant_text_min: 0.35
  layout_variant_text_max: 0.69
  layout_variant_resnet_min: 0.65
  layout_variant_resnet_max: 0.90
